<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="description" content="联合公社欢迎每一位同学的加入，无论你擅长什么，这里都有你的位置。">
    <link rel="canonical" href="https://lianhegongshe.cn/join.html">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta name="theme-color" content="#1d5578">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="联合公社">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="加入我们 | 联合公社">
    <meta property="og:description" content="联合公社欢迎每一位同学的加入，无论你擅长什么，这里都有你的位置。">
    <meta property="og:url" content="https://lianhegongshe.cn/join.html">
    <meta property="og:image" content="https://lianhegongshe.cn/images/logo.jpeg">
    <meta property="og:image:width" content="400">
    <meta property="og:image:height" content="395">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="加入我们 | 联合公社">
    <meta name="twitter:description" content="联合公社欢迎每一位同学的加入，无论你擅长什么，这里都有你的位置。">
    <meta name="twitter:image" content="https://lianhegongshe.cn/images/logo.jpeg">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/effects.css">
    <style>
        /* ===== 页面标题 ===== */
        .page-header {
            text-align: center;
            margin: 2rem 0 3rem;
            position: relative;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-blue) 50%, var(--primary-dark) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            animation: heroGradient 4s ease infinite;
        }
        .page-header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        /* 装饰浮动圆 */
        .page-header::before,
        .page-header::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.06;
            pointer-events: none;
        }
        .page-header::before {
            width: 160px;
            height: 160px;
            background: var(--primary);
            top: -30px;
            left: -40px;
            animation: float 6s ease-in-out infinite;
        }
        .page-header::after {
            width: 100px;
            height: 100px;
            background: var(--accent-orange);
            bottom: -10px;
            right: -30px;
            animation: float 8s ease-in-out infinite reverse;
        }

        /* ===== 加入我们卡片 ===== */
        .join-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-blue) 100%);
            border-radius: var(--radius-lg);
            padding: 3rem 2rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
            max-width: 560px;
            margin: 0 auto;
        }
        .join-card::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            top: -60px;
            right: -40px;
            pointer-events: none;
        }
        .join-card::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            bottom: -30px;
            left: -20px;
            pointer-events: none;
        }
        .join-icon {
            font-size: 2rem;
            margin-bottom: 0.8rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }
        .join-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .join-desc {
            font-size: 0.95rem;
            opacity: 0.85;
            max-width: 480px;
            margin: 0 auto 1.5rem;
            line-height: 1.7;
            position: relative;
            z-index: 1;
        }

        /* 加入表单 */
        .join-form {
            max-width: 420px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .form-row {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 0.65rem 1rem;
            border-radius: var(--radius-sm);
            border: 1.5px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(4px);
            transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
        }
        .form-input::placeholder, .form-textarea::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .form-input:focus, .form-textarea:focus {
            border-color: rgba(255, 254, 251, 0.75);
            background: rgba(255,255,255,0.18);
        }
        .form-input:disabled, .form-textarea:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .form-textarea {
            resize: none;
            margin-bottom: 1rem;
        }

        /* 提交按钮（暂未开放） */
        .join-submit-btn {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            color: rgba(0,0,0,0.45);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.7rem 2rem;
            border-radius: var(--radius-sm);
            border: none;
            cursor: not-allowed;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(4px);
        }
        .join-submit-btn:hover {
            transform: none;
            box-shadow: none;
        }
        .join-notice {
            margin-top: 0.8rem;
            font-size: 0.8rem;
            opacity: 0.6;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .container {
                padding: 1rem 1rem 2rem;
            }
            .page-header {
                margin: 1.5rem 0 2rem;
            }
            .page-header h1 {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }
            .page-header p {
                font-size: 0.88rem;
            }
            .form-row {
                flex-direction: column;
                gap: 0.6rem;
            }
            .join-card {
+
                border-radius: var(--radius-lg);
            }
            .join-title {
                font-size: 1.3rem;
            }
            .join-desc {
                font-size: 0.88rem;
            }
            .join-icon {
                font-size: 1.6rem;
            }
            .join-form {
                max-width: 100%;
            }
            .form-input, .form-textarea {
                padding: 0.7rem 0.9rem;
                font-size: 16px;
            }
            .join-submit-btn {
                padding: 0.75rem 1.8rem;
                font-size: 0.9rem;
            }
            footer {
                padding: 2rem 1rem;
            }
            .page-header::before {
                width: 100px;
                height: 100px;
            }
            .page-header::after {
                width: 60px;
                height: 60px;
            }
        }

        @media (max-width: 480px) {
            .top-bar {
                padding: 0.6rem 0.8rem;
            }
            .logo {
                font-size: 1.2rem;
            }
            .logo-icon {
                width: 24px;
                height: 24px;
                font-size: 0.7rem;
                border-radius: 6px;
            }
            .back-btn {
                font-size: 0.82rem;
                padding: 0.4rem 0.6rem;
            }
            .container {
                padding: 0.8rem 0.75rem 2rem;
            }
            .page-header {
                margin: 1rem 0 1.5rem;
            }
            .page-header h1 {
                font-size: 1.5rem;
                letter-spacing: 0.5px;
            }
            .page-header p {
                font-size: 0.82rem;
            }
            .join-card {
+
                border-radius: var(--radius-lg);
            }
            .join-title {
                font-size: 1.15rem;
            }
            .join-desc {
                font-size: 0.82rem;
                margin-bottom: 1.2rem;
            }
            .join-notice {
                font-size: 0.75rem;
            }
        }

    </style>
</head>
<body>

<canvas id="particles-canvas" aria-hidden="true"></canvas>

<div class="top-bar" id="topBar">
    <a href="/" class="logo">
        <div class="logo-icon">联</div>
        联合公社
    </a>
    <a href="/members/" class="back-btn">
        <span class="back-arrow">←</span> 返回社员
    </a>
</div>

<main class="container">
    <div class="page-header">
        <h1>加入我们</h1>
        <p>无论你擅长什么，联合公社都欢迎你的加入</p>
    </div>

    <div class="join-card">
        <div class="join-icon">✦</div>
        <h2 class="join-title">加入联合公社</h2>
        <p class="join-desc">在这里，与志同道合的伙伴一起成长、创造、发光。</p>
        <!-- 功能尚未开放，因此不使用 <form>，也不存在误提交的问题 -->
        <div class="join-form">
            <div class="form-row">
                <input type="text" class="form-input" placeholder="你的身份 / 称呼" aria-label="你的身份或称呼" disabled>
                <input type="text" class="form-input" placeholder="意向分社（如硬算社、朗诵社等）" aria-label="意向分社" disabled>
            </div>
            <textarea class="form-textarea" placeholder="简单介绍一下自己吧…" aria-label="自我介绍" rows="3" disabled></textarea>
            <button type="button" class="join-submit-btn" disabled>
                暂未开放
            </button>
            <p class="join-notice">提交表单功能正在开发中，敬请期待</p>
        </div>
    </div>
</main>

<footer>
    © <span id="copyright-year">2026</span> 联合公社 · 学生团体组织
</footer>

<script src="/js/particles.js"></script>
<script src="/js/site.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>加入我们 | 联合公社</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/effects.css">
    <style>
        /* ===== 页面标题 ===== */
        .page-header {
            text-align: center;
            margin: 2rem 0 3rem;
            position: relative;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-blue) 50%, var(--primary-dark) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            animation: heroGradient 4s ease infinite;
        }
        .page-header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        /* 装饰浮动圆 */
        .page-header::before,
        .page-header::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.06;
            pointer-events: none;
        }
        .page-header::before {
            width: 160px;
            height: 160px;
            background: var(--primary);
            top: -30px;
            left: -40px;
            animation: float 6s ease-in-out infinite;
        }
        .page-header::after {
            width: 100px;
            height: 100px;
            background: var(--accent-orange);
            bottom: -10px;
            right: -30px;
            animation: float 8s ease-in-out infinite reverse;
        }

        /* ===== 加入我们卡片 ===== */
        .join-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-blue) 100%);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
            max-width: 560px;
            margin: 0 auto;
        }
        .join-card::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            top: -60px;
            right: -40px;
            pointer-events: none;
        }
        .join-card::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            bottom: -30px;
            left: -20px;
            pointer-events: none;
        }
        .join-icon {
            font-size: 2rem;
            margin-bottom: 0.8rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }
        .join-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .join-desc {
            font-size: 0.95rem;
            opacity: 0.85;
            max-width: 480px;
            margin: 0 auto 1.5rem;
            line-height: 1.7;
            position: relative;
            z-index: 1;
        }

        /* 加入表单 */
        .join-form {
            max-width: 420px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .form-row {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 0.65rem 1rem;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(4px);
            transition: border-color 0.2s, background 0.2s;
        }
        .form-input::placeholder, .form-textarea::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .form-input:focus, .form-textarea:focus {
            border-color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.18);
        }
        .form-input:disabled, .form-textarea:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .form-textarea {
            resize: none;
            margin-bottom: 1rem;
        }

        /* 提交按钮（暂未开放） */
        .join-submit-btn {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            color: rgba(0,0,0,0.45);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.7rem 2rem;
            border-radius: 40px;
            border: none;
            cursor: not-allowed;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(4px);
        }
        .join-submit-btn:hover {
            transform: none;
            box-shadow: none;
        }
        .join-notice {
            margin-top: 0.8rem;
            font-size: 0.8rem;
            opacity: 0.6;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .container {
                padding: 1rem 1rem 2rem;
            }
            .page-header {
                margin: 1.5rem 0 2rem;
            }
            .page-header h1 {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }
            .page-header p {
                font-size: 0.88rem;
            }
            .form-row {
                flex-direction: column;
                gap: 0.6rem;
            }
            .join-card {
                padding: 2rem 1.2rem;
                border-radius: 20px;
            }
            .join-title {
                font-size: 1.3rem;
            }
            .join-desc {
                font-size: 0.88rem;
            }
            .join-icon {
                font-size: 1.6rem;
            }
            .join-form {
                max-width: 100%;
            }
            .form-input, .form-textarea {
                padding: 0.7rem 0.9rem;
                font-size: 16px;
            }
            .join-submit-btn {
                padding: 0.75rem 1.8rem;
                font-size: 0.9rem;
            }
            footer {
                padding: 2rem 1rem;
            }
            .page-header::before {
                width: 100px;
                height: 100px;
            }
            .page-header::after {
                width: 60px;
                height: 60px;
            }
        }

        @media (max-width: 480px) {
            .top-bar {
                padding: 0.6rem 0.8rem;
            }
            .logo {
                font-size: 1.2rem;
            }
            .logo-icon {
                width: 24px;
                height: 24px;
                font-size: 0.7rem;
                border-radius: 6px;
            }
            .back-btn {
                font-size: 0.82rem;
                padding: 0.4rem 0.6rem;
            }
            .container {
                padding: 0.8rem 0.75rem 2rem;
            }
            .page-header {
                margin: 1rem 0 1.5rem;
            }
            .page-header h1 {
                font-size: 1.5rem;
                letter-spacing: 0.5px;
            }
            .page-header p {
                font-size: 0.82rem;
            }
            .join-card {
                padding: 1.5rem 1rem;
                border-radius: 16px;
            }
            .join-title {
                font-size: 1.15rem;
            }
            .join-desc {
                font-size: 0.82rem;
                margin-bottom: 1.2rem;
            }
            .join-notice {
                font-size: 0.75rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            #particles-canvas {
                display: none;
            }
        }
    </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div class="top-bar" id="topBar">
    <a href="/" class="logo">
        <div class="logo-icon">联</div>
        联合公社
    </a>
    <a href="/members/" class="back-btn">
        <span class="back-arrow">←</span> 返回社员
    </a>
</div>

<main class="container">
    <div class="page-header">
        <h1>加入我们</h1>
        <p>无论你擅长什么，联合公社都欢迎你的加入</p>
    </div>

    <div class="join-card">
        <div class="join-icon">✦</div>
        <h2 class="join-title">加入联合公社</h2>
        <p class="join-desc">在这里，与志同道合的伙伴一起成长、创造、发光。</p>
        <form class="join-form" onsubmit="return false;">
            <div class="form-row">
                <input type="text" class="form-input" placeholder="你的身份 / 称呼" disabled>
                <input type="text" class="form-input" placeholder="意向分社（如硬算社、朗诵社等）" disabled>
            </div>
            <textarea class="form-textarea" placeholder="简单介绍一下自己吧…" rows="3" disabled></textarea>
            <button type="submit" class="join-submit-btn" disabled>
                暂未开放
            </button>
            <p class="join-notice">提交表单功能正在开发中，敬请期待</p>
        </form>
    </div>
</main>

<footer>
    © 2026 联合公社 · 学生团体组织
</footer>

<script>
    // ===== 导航栏滚动效果 =====
    const topBar = document.getElementById('topBar');
    window.addEventListener('scroll', () => {
        topBar.classList.toggle('scrolled', window.scrollY > 10);
    });

    // ===== 粒子背景效果 =====
    (function() {
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let vw, vh, pageHeight, particles, animId;
        const mouse = { x: -9999, y: -9999 };

        const colors = [
            'rgba(79,110,247,',
            'rgba(79,156,247,',
            'rgba(59,93,231,',
            'rgba(240,100,73,',
            'rgba(245,166,35,',
        ];

        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        document.addEventListener('mouseleave', () => {
            mouse.x = -9999;
            mouse.y = -9999;
        });

        function resize() {
            vw = canvas.width = window.innerWidth;
            vh = canvas.height = window.innerHeight;
            pageHeight = document.documentElement.scrollHeight;
        }

        function createParticle(fadeIn) {
            const colorBase = colors[Math.random() < 0.75 ? Math.floor(Math.random() * 3) : 3 + Math.floor(Math.random() * 2)];
            const scrollY = window.scrollY;
            const yMin = fadeIn ? scrollY : 0;
            const yMax = fadeIn ? scrollY + vh : pageHeight;
            return {
                x: Math.random() * vw,
                y: yMin + Math.random() * (yMax - yMin),
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.3 - 0.15,
                radius: Math.random() * 2.5 + 1,
                color: colorBase,
                alpha: fadeIn ? 0 : (Math.random() * 0.4 + 0.15),
                targetAlpha: Math.random() * 0.4 + 0.15,
                alphaDir: (Math.random() - 0.5) * 0.005,
                fadingOut: false,
                fadingIn: !!fadeIn,
            };
        }

        function createParticles() {
            const count = Math.min(Math.floor((vw * vh) / 18000), 80);
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(createParticle(false));
            }
        }

        function update() {
            const scrollY = window.scrollY;
            particles.forEach((p, i) => {
                const screenY = p.y - scrollY;
                const dx = p.x - mouse.x;
                const dy = screenY - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150 && dist > 0) {
                    const force = (150 - dist) / 150 * 0.3;
                    p.vx += (dx / dist) * force;
                    p.vy += (dy / dist) * force;
                }

                p.vx *= 0.99;
                p.vy *= 0.99;
                p.x += p.vx;
                p.y += p.vy;

                if (p.fadingIn) {
                    p.alpha += 0.012;
                    if (p.alpha >= p.targetAlpha) {
                        p.alpha = p.targetAlpha;
                        p.fadingIn = false;
                    }
                }

                if (!p.fadingIn && !p.fadingOut) {
                    p.alpha += p.alphaDir;
                    if (p.alpha > 0.55 || p.alpha < 0.1) p.alphaDir *= -1;
                }

                const margin = 50;
                const viewY = p.y - scrollY;
                const outOfView = p.x < -margin || p.x > vw + margin || viewY < -margin || viewY > vh + margin;
                if (outOfView) {
                    p.fadingOut = true;
                } else if (p.fadingOut && !p.fadingIn) {
                    p.fadingOut = false;
                    if (p.alpha < 0.1) p.alpha = 0.1;
                }

                if (p.fadingOut) {
                    p.alpha -= 0.008;
                    if (p.alpha <= 0) {
                        particles[i] = createParticle(true);
                    }
                }
            });
        }

        function drawParticle(p) {
            const screenY = p.y - window.scrollY;
            if (screenY < -20 || screenY > vh + 20) return;
            ctx.beginPath();
            ctx.arc(p.x, screenY, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color + p.alpha + ')';
            ctx.fill();
        }

        function drawLines() {
            const scrollY = window.scrollY;
            const maxDist = 120;
            for (let i = 0; i < particles.length; i++) {
                const pi = particles[i];
                const si = pi.y - scrollY;
                if (si < -maxDist || si > vh + maxDist) continue;
                for (let j = i + 1; j < particles.length; j++) {
                    const pj = particles[j];
                    const sj = pj.y - scrollY;
                    if (sj < -maxDist || sj > vh + maxDist) continue;
                    const dx = pi.x - pj.x;
                    const dy = si - sj;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.12;
                        ctx.beginPath();
                        ctx.moveTo(pi.x, si);
                        ctx.lineTo(pj.x, sj);
                        ctx.strokeStyle = 'rgba(79,110,247,' + alpha + ')';
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, vw, vh);
            update();
            drawLines();
            particles.forEach(drawParticle);
            animId = requestAnimationFrame(animate);
        }

        function init() {
            resize();
            createParticles();
            if (animId) cancelAnimationFrame(animId);
            animate();
        }

        const resizeObserver = new ResizeObserver(() => {
            pageHeight = document.documentElement.scrollHeight;
        });
        resizeObserver.observe(document.documentElement);

        window.addEventListener('resize', () => {
            resize();
            createParticles();
        });

        init();
    })();
</script>
</body>
</html>

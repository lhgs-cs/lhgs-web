<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 联合公社</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .error-container {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #2563eb;  /* 蓝色 */
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: 4px;
        }

        .error-message {
            font-size: 1.3rem;
            font-weight: 500;
            color: #1e293b;  /* 深灰色/黑色调 */
            margin-bottom: 0.5rem;
        }

        .error-hint {
            font-size: 1rem;
            color: #475569;
            margin-bottom: 2rem;
        }

        .home-btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 40px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .home-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }

        .home-btn:active {
            transform: translateY(1px);
        }

        /* 响应式：手机端缩小404数字 */
        @media (max-width: 480px) {
            .error-code {
                font-size: 5rem;
            }
            .error-message {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-message">你访问的页面不存在或已经移除</div>
        <div class="error-hint">如果你确定该页面应该存在，请联系网站管理员</div>
        <a href="/index.html" class="home-btn">返回首页</a>
    </div>
</body>
</html>

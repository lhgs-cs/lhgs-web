<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 联合公社</title>

    <meta name="description" content="你访问的页面不存在或已经移除。">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta name="theme-color" content="#1d5578">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="联合公社">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="页面未找到 - 联合公社">
    <meta property="og:description" content="你访问的页面不存在或已经移除。">
    <meta property="og:image" content="https://lianhegongshe.cn/images/logo.jpeg">
    <meta property="og:image:width" content="400">
    <meta property="og:image:height" content="395">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="页面未找到 - 联合公社">
    <meta name="twitter:description" content="你访问的页面不存在或已经移除。">
    <meta name="twitter:image" content="https://lianhegongshe.cn/images/logo.jpeg">
    <style>
        /* 该页不引用 common.css，令牌在此内联定义 */
        :root {
            --primary: #1d5578;
            --primary-dark: #143f5c;
            --bg: #f5f3ee;
            --text: #16324a;
            --text-secondary: #4a5b6b;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #f5f3ee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .error-container {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #1d5578;  /* 蓝色 */
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: 4px;
        }

        .error-message {
            font-size: 1.3rem;
            font-weight: 500;
            color: #16324a;  /* 深灰色/黑色调 */
            margin-bottom: 0.5rem;
        }

        .error-hint {
            font-size: 1rem;
            color: #4a5b6b;
            margin-bottom: 2rem;
        }

        .home-btn {
            display: inline-block;
            background-color: #1d5578;
            color: white;
            text-decoration: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            transition: background 0.2s var(--ease), transform 0.1s var(--ease);
            box-shadow: 0 1px 2px rgba(22, 50, 74, .04), 0 2px 8px -2px rgba(22, 50, 74, .07);
        }

        .home-btn:hover {
            background-color: #143f5c;
            transform: translateY(-1px);
        }

        .home-btn:active {
            transform: translateY(1px);
        }

        /* 响应式：手机端缩小404数字 */
        @media (max-width: 480px) {
            .error-code {
                font-size: 5rem;
            }
            .error-message {
                font-size: 1.1rem;
            }
        }

        /* ===== 粒子背景 ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }
        .error-container {
            position: relative;
            z-index: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            #particles-canvas {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas" aria-hidden="true"></canvas>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-message">你访问的页面不存在或已经移除</div>
        <div class="error-hint">如果你确定该页面应该存在，请联系网站管理员</div>
        <a href="/" class="home-btn">返回首页</a>
    </div>

<script src="/js/particles.js"></script>
</body>
</html>

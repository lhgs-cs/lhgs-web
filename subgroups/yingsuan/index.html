    <style>
        :root {
            --accent: #a83a2e;
            --accent-light: #f7ece9;
            --accent-gradient: linear-gradient(135deg, #a83a2e, #c25a4a);
        }

        .page-hero {
            text-align: center;
            margin: 2rem 0 3rem;
            position: relative;
        }
        .page-hero-icon {
            width: 80px; height: 80px;
            border-radius: var(--radius-lg);
            background: var(--accent-gradient);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 8px 24px rgba(168,58,46,0.2);
            animation: iconFloat 3s ease-in-out infinite;
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .page-hero h1 {
            font-size: 2.5rem; font-weight: 800;
            color: var(--text); letter-spacing: 2px;
        }
        .page-hero-sub {
            color: var(--text-muted); margin-top: 0.5rem; font-size: 0.95rem;
        }

        .page-hero::before,
        .page-hero::after {
            content: ''; position: absolute; border-radius: 50%; opacity: 0.06; pointer-events: none;
        }
        .page-hero::before {
            width: 180px; height: 180px; background: var(--accent);
            top: -40px; left: -50px; animation: float 6s ease-in-out infinite;
        }
        .page-hero::after {
            width: 120px; height: 120px; background: var(--primary);
            bottom: -20px; right: -30px; animation: float 8s ease-in-out infinite reverse;
        }

        .info-section { margin: 2.5rem 0; }
        .info-section-title {
            font-size: 1.3rem; font-weight: 700; color: var(--text);
            margin-bottom: 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .info-section-title::before {
            content: ''; width: 4px; height: 24px; border-radius: 4px;
            background: var(--accent-gradient);
        }

        .info-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 1.8rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            line-height: 1.8;
            color: var(--text-secondary);
            transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
        }
        .info-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .member-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .member-card {
            display: flex; align-items: center;
            background: var(--card-bg); border-radius: var(--radius-lg);
            padding: 1rem 1.4rem;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            transition: transform 0.3s var(--ease), box-shadow 0.3s, border-color 0.3s;
            cursor: default;
            opacity: 0; transform: translateX(-20px);
        }
        .member-card.visible { opacity: 1; transform: translateX(0); }
        .member-card:hover {
            transform: translateX(6px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }
        .member-avatar {
            width: 52px; height: 52px; border-radius: var(--radius-md);
            object-fit: cover; background-color: rgba(22,50,74,.10);
            margin-right: 1rem; flex-shrink: 0;
            transition: transform 0.3s var(--ease), border-radius 0.3s var(--ease);
        }
        .member-card:hover .member-avatar {
            transform: scale(1.08); border-radius: 50%;
        }
        .member-info { flex: 1; }
        .member-name { font-size: 1.1rem; font-weight: 700; color: var(--text); }
        .member-bio { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.15rem; }
        .member-tag {
            display: inline-block; font-size: 0.7rem; font-weight: 600;
            padding: 0.15rem 0.55rem; border-radius: 6px; margin-top: 0.4rem;
            background: var(--accent-light); color: var(--primary-dark);
        }

        .reveal {
            opacity: 0; transform: translateY(25px);
            transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
        }
        .reveal.visible { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .container { padding: 1rem 1rem 2rem; }
            .page-hero h1 { font-size: 2rem; }
            .page-hero-icon { width: 64px; height: 64px; font-size: 2rem; }
            .page-hero::before { width: 100px; height: 100px; }
            .page-hero::after { width: 60px; height: 60px; }
        }

        @media (max-width: 480px) {
            .top-bar { padding: 0.6rem 0.8rem; }
            .logo { font-size: 1.2rem; }
            .logo-icon { width: 24px; height: 24px; font-size: 0.7rem; border-radius: 6px; }
            .back-btn { font-size: 0.82rem; padding: 0.4rem 0.6rem; }
            .container { padding: 0.8rem 0.75rem 2rem; }
            .page-hero h1 { font-size: 1.6rem; }
            .page-hero-icon { width: 56px; height: 56px; font-size: 1.6rem; }
            .info-card { padding: 1.2rem; }
        }

    </style>

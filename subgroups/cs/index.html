<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>计算机科学社 | 联合公社</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        :root {
            --accent: #4f9cf7;
            --accent-light: #eef4ff;
            --accent-gradient: linear-gradient(135deg, #4f9cf7, #4f6ef7);
        }

        .page-hero {
            text-align: center;
            margin: 2rem 0 3rem;
            position: relative;
        }
        .page-hero-icon {
            width: 80px; height: 80px;
            border-radius: 24px;
            background: var(--accent-gradient);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 8px 24px rgba(79,156,247,0.2);
            animation: iconFloat 3s ease-in-out infinite;
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .page-hero h1 {
            font-size: 2.5rem; font-weight: 800;
            color: var(--text); letter-spacing: 2px;
        }
        .page-hero-sub {
            color: var(--text-muted); margin-top: 0.5rem; font-size: 0.95rem;
        }

        .page-hero::before,
        .page-hero::after {
            content: ''; position: absolute; border-radius: 50%; opacity: 0.06; pointer-events: none;
        }
        .page-hero::before {
            width: 180px; height: 180px; background: var(--accent);
            top: -40px; left: -50px; animation: float 6s ease-in-out infinite;
        }
        .page-hero::after {
            width: 120px; height: 120px; background: var(--primary-dark);
            bottom: -20px; right: -30px; animation: float 8s ease-in-out infinite reverse;
        }

        .info-section { margin: 2.5rem 0; }
        .info-section-title {
            font-size: 1.3rem; font-weight: 700; color: var(--text);
            margin-bottom: 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .info-section-title::before {
            content: ''; width: 4px; height: 24px; border-radius: 4px;
            background: var(--accent-gradient);
        }

        .info-card {
            background: var(--card-bg); border-radius: 20px;
            padding: 1.8rem;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            line-height: 1.8; color: var(--text-secondary);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .info-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .feature-card {
            background: var(--card-bg); border-radius: 16px;
            padding: 1.3rem;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .feature-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .feature-icon {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .feature-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
        }
        .feature-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        .member-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .member-card {
            display: flex; align-items: center;
            background: var(--card-bg); border-radius: 18px;
            padding: 1rem 1.4rem;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s, border-color 0.3s;
            cursor: default;
            opacity: 0; transform: translateX(-20px);
        }
        .member-card.visible { opacity: 1; transform: translateX(0); }
        .member-card:hover {
            transform: translateX(6px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }
        .member-avatar {
            width: 52px; height: 52px; border-radius: 14px;
            object-fit: cover; background-color: #e8ecf4;
            margin-right: 1rem; flex-shrink: 0;
            transition: transform 0.3s, border-radius 0.3s;
        }
        .member-card:hover .member-avatar {
            transform: scale(1.08); border-radius: 50%;
        }
        .member-info { flex: 1; }
        .member-name { font-size: 1.1rem; font-weight: 700; color: var(--text); }
        .member-bio { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.15rem; }
        .member-tag {
            display: inline-block; font-size: 0.7rem; font-weight: 600;
            padding: 0.15rem 0.55rem; border-radius: 6px; margin-top: 0.4rem;
            background: var(--accent-light); color: var(--accent);
        }

        .reveal {
            opacity: 0; transform: translateY(25px);
            transition: opacity 0.6s cubic-bezier(0.4,0,0.2,1), transform 0.6s cubic-bezier(0.4,0,0.2,1);
        }
        .reveal.visible { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .container { padding: 1rem 1rem 2rem; }
            .page-hero h1 { font-size: 2rem; }
            .page-hero-icon { width: 64px; height: 64px; font-size: 2rem; }
            .page-hero::before { width: 100px; height: 100px; }
            .page-hero::after { width: 60px; height: 60px; }
        }

        @media (max-width: 480px) {
            .top-bar { padding: 0.6rem 0.8rem; }
            .logo { font-size: 1.2rem; }
            .logo-icon { width: 24px; height: 24px; font-size: 0.7rem; border-radius: 6px; }
            .back-btn { font-size: 0.82rem; padding: 0.4rem 0.6rem; }
            .container { padding: 0.8rem 0.75rem 2rem; }
            .page-hero h1 { font-size: 1.6rem; }
            .page-hero-icon { width: 56px; height: 56px; font-size: 1.6rem; }
            .info-card { padding: 1.2rem; }
            .feature-grid { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div class="top-bar" id="topBar">
    <a href="/" class="logo">
        <div class="logo-icon">联</div>
        联合公社
    </a>
    <a href="/" class="back-btn">
        <span class="back-arrow">←</span> 返回首页
    </a>
</div>

<main class="container">
    <div class="page-hero">
        <div class="page-hero-icon">💻</div>
        <h1>计算机科学社</h1>
        <p class="page-hero-sub">Computer Science Club</p>
    </div>

    <div class="info-section reveal">
        <h2 class="info-section-title">简介</h2>
        <div class="info-card">
            CS社，简称计科社，是联合公社的核心分社之一。负责技术开发与维护，培养计算机科学兴趣，组织开展编程、算法、系统设计等技术活动。
        </div>
    </div>

    <div class="info-section reveal">
        <h2 class="info-section-title">社团特色</h2>
        <div class="feature-grid">
            <div class="feature-card">
                <div class="feature-icon">🖥️</div>
                <div class="feature-name">编程实践</div>
                <div class="feature-desc">从入门到进阶的编程训练</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🌐</div>
                <div class="feature-name">网站开发</div>
                <div class="feature-desc">维护与搭建联合公社官网</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🔧</div>
                <div class="feature-name">算法挑战</div>
                <div class="feature-desc">算法竞赛与逻辑思维训练</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🤝</div>
                <div class="feature-name">项目协作</div>
                <div class="feature-desc">Git协作与团队项目开发</div>
            </div>
        </div>
    </div>

    <div class="info-section reveal">
        <h2 class="info-section-title">社员</h2>
        <div class="member-list" id="memberList"></div>
    </div>
</main>

<footer>
    © 2026 联合公社 · 学生团体组织
</footer>

<script src="/js/members-data.js"></script>
<script>
    const topBar = document.getElementById('topBar');
    window.addEventListener('scroll', () => {
        topBar.classList.toggle('scrolled', window.scrollY > 10);
    });

    function renderMembers() {
        const container = document.getElementById('memberList');
        if (!container) return;
        let members = MEMBERS.filter(m => 
            m.subgroups && m.subgroups.some(sg => sg.id === 'cs')
        );
        members.sort((a, b) => {
            const roleA = a.subgroups.find(sg => sg.id === 'cs')?.role || '';
            const roleB = b.subgroups.find(sg => sg.id === 'cs')?.role || '';
            if (roleA === '社长' && roleB !== '社长') return -1;
            if (roleA !== '社长' && roleB === '社长') return 1;
            return 0;
        });
        container.innerHTML = '';
        members.forEach(member => {
            const sgObj = member.subgroups.find(sg => sg.id === 'cs');
            const role = sgObj ? sgObj.role : '';
            const card = document.createElement('div');
            card.className = 'member-card';
            const roleTag = role ? `<span class="member-tag">${role}</span>` : '';
            card.innerHTML = `
                <img class="member-avatar" src="${member.avatar}" alt="${member.name}头像">
                <div class="member-info">
                    <div class="member-name">${member.name}</div>
                    <div class="member-bio">${member.bio || ''}</div>
                    ${roleTag}
                </div>
            `;
            container.appendChild(card);
        });
        const cards = document.querySelectorAll('.member-card');
        cards.forEach((card, i) => {
            setTimeout(() => card.classList.add('visible'), i * 120);
        });
    }

    const reveals = document.querySelectorAll('.reveal');
    const revealObs = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
            if (entry.isIntersecting) {
                setTimeout(() => entry.target.classList.add('visible'), i * 100);
                revealObs.unobserve(entry.target);
            }
        });
    }, { threshold: 0.15 });
    reveals.forEach(el => revealObs.observe(el));

    document.addEventListener('DOMContentLoaded', renderMembers);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>全部社员 | 联合公社</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4f6ef7;
            --primary-dark: #3b5de7;
            --primary-light: #eef1fe;
            --accent-red: #f06449;
            --accent-orange: #f5a623;
            --accent-blue: #4f9cf7;
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #5a6a85;
            --text-muted: #94a3b8;
            --border: #e8ecf4;
            --shadow-sm: 0 2px 8px rgba(79,110,247,0.06);
            --shadow-md: 0 8px 24px rgba(79,110,247,0.08);
            --shadow-lg: 0 16px 40px rgba(79,110,247,0.12);
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== 顶部导航栏 ===== */
        .top-bar {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 0 var(--border);
            transition: box-shadow 0.3s;
        }
        .top-bar.scrolled {
            box-shadow: 0 4px 20px rgba(79,110,247,0.08);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--primary), var(--accent-blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem 0.8rem;
            border-radius: 10px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
        }
        .back-btn:hover {
            background-color: var(--primary-light);
        }
        .back-arrow {
            transition: transform 0.2s;
        }
        .back-btn:hover .back-arrow {
            transform: translateX(-3px);
        }

        /* ===== 主内容区 ===== */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* ===== 页面标题 ===== */
        .page-header {
            text-align: center;
            margin: 2rem 0 3rem;
            position: relative;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-blue) 50%, var(--primary-dark) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            animation: heroGradient 4s ease infinite;
        }
        @keyframes heroGradient {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 100% center; }
        }
        .page-header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        /* 装饰浮动圆 */
        .page-header::before,
        .page-header::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.06;
            pointer-events: none;
        }
        .page-header::before {
            width: 160px;
            height: 160px;
            background: var(--primary);
            top: -30px;
            left: -40px;
            animation: float 6s ease-in-out infinite;
        }
        .page-header::after {
            width: 100px;
            height: 100px;
            background: var(--accent-orange);
            bottom: -10px;
            right: -30px;
            animation: float 8s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* ===== 统计条 ===== */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
            padding: 1rem 1.5rem;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            min-width: 120px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .stat-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        /* ===== 社员网格 ===== */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .member-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), box-shadow 0.35s, border-color 0.35s;
            cursor: default;
            opacity: 0;
            transform: translateY(20px);
        }
        .member-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .member-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .member-avatar {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            object-fit: cover;
            background-color: #e8ecf4;
            flex-shrink: 0;
            transition: transform 0.3s, border-radius 0.3s;
        }
        .member-card:hover .member-avatar {
            transform: scale(1.08);
            border-radius: 50%;
        }

        .member-info {
            flex: 1;
            min-width: 0;
        }
        .member-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .member-bio {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            display: none;
        }
        .empty-state.show {
            display: block;
        }
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .empty-text {
            font-size: 1rem;
        }

        /* ===== 页脚 ===== */
        footer {
            text-align: center;
            padding: 2.5rem 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }
        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .container {
                padding: 1rem 1rem 2rem;
            }
            .page-header {
                margin: 1.5rem 0 2rem;
            }
            .page-header h1 {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }
            .page-header p {
                font-size: 0.88rem;
            }
            .member-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .member-card {
                padding: 1.1rem;
                border-radius: 16px;
            }
            .member-avatar {
                width: 48px;
                height: 48px;
                border-radius: 14px;
            }
            .member-name {
                font-size: 1rem;
            }
            .stats-bar {
                gap: 0.8rem;
                margin-bottom: 2rem;
            }
            .stat-item {
                min-width: 90px;
                padding: 0.7rem 0.8rem;
                border-radius: 12px;
            }
            .stat-number {
                font-size: 1.5rem;
            }
            .stat-label {
                font-size: 0.75rem;
            }
            .page-header::before {
                width: 100px;
                height: 100px;
            }
            .page-header::after {
                width: 60px;
                height: 60px;
            }
            .form-row {
                flex-direction: column;
                gap: 0.6rem;
            }
            .join-card {
                padding: 2rem 1.2rem;
                border-radius: 20px;
            }
            .join-title {
                font-size: 1.3rem;
            }
            .join-desc {
                font-size: 0.88rem;
            }
            .join-icon {
                font-size: 1.6rem;
            }
            .join-form {
                max-width: 100%;
            }
            .form-input, .form-textarea {
                padding: 0.7rem 0.9rem;
                font-size: 16px; /* 防止 iOS 自动缩放 */
            }
            .join-btn {
                padding: 0.75rem 1.8rem;
                font-size: 0.9rem;
            }
            footer {
                padding: 2rem 1rem;
            }
        }

        @media (max-width: 480px) {
            .top-bar {
                padding: 0.6rem 0.8rem;
            }
            .logo {
                font-size: 1.2rem;
            }
            .logo-icon {
                width: 24px;
                height: 24px;
                font-size: 0.7rem;
                border-radius: 6px;
            }
            .back-btn {
                font-size: 0.82rem;
                padding: 0.4rem 0.6rem;
            }
            .container {
                padding: 0.8rem 0.75rem 2rem;
            }
            .page-header {
                margin: 1rem 0 1.5rem;
            }
            .page-header h1 {
                font-size: 1.5rem;
                letter-spacing: 0.5px;
            }
            .page-header p {
                font-size: 0.82rem;
            }
            .stats-bar {
                gap: 0.6rem;
            }
            .stat-item {
                flex: 1;
                min-width: 0;
                padding: 0.6rem 0.5rem;
            }
            .stat-number {
                font-size: 1.3rem;
            }
            .member-card {
                padding: 0.9rem;
                gap: 0.75rem;
            }
            .member-avatar {
                width: 42px;
                height: 42px;
                border-radius: 12px;
            }
            .member-name {
                font-size: 0.95rem;
            }
            .member-bio {
                font-size: 0.78rem;
            }
            .join-card {
                padding: 1.5rem 1rem;
                border-radius: 16px;
            }
            .join-title {
                font-size: 1.15rem;
            }
            .join-desc {
                font-size: 0.82rem;
                margin-bottom: 1.2rem;
            }
            .join-notice {
                font-size: 0.75rem;
            }
            .empty-state {
                padding: 3rem 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            #particles-canvas {
                display: none;
            }
        }

        /* ===== 加入我们 ===== */
        .join-section {
            margin-top: 3rem;
        }
        .join-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-blue) 100%);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .join-card::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            top: -60px;
            right: -40px;
            pointer-events: none;
        }
        .join-card::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            bottom: -30px;
            left: -20px;
            pointer-events: none;
        }
        .join-icon {
            font-size: 2rem;
            margin-bottom: 0.8rem;
            opacity: 0.9;
        }
        .join-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
        }
        .join-desc {
            font-size: 0.95rem;
            opacity: 0.85;
            max-width: 480px;
            margin: 0 auto 1.5rem;
            line-height: 1.7;
        }
        .join-btn {
            display: inline-block;
            background: white;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.7rem 2rem;
            border-radius: 40px;
            text-decoration: none;
            transition: transform 0.25s, box-shadow 0.25s;
            position: relative;
            z-index: 1;
            border: none;
            cursor: pointer;
        }
        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .join-btn-disabled {
            background: rgba(255,255,255,0.35);
            color: rgba(255,255,255,0.7);
            cursor: not-allowed;
            backdrop-filter: blur(4px);
        }
        .join-btn-disabled:hover {
            transform: none;
            box-shadow: none;
        }

        /* 加入表单 */
        .join-form {
            max-width: 420px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .form-row {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 0.65rem 1rem;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(4px);
            transition: border-color 0.2s, background 0.2s;
        }
        .form-input::placeholder, .form-textarea::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .form-input:disabled, .form-textarea:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .form-textarea {
            resize: none;
            margin-bottom: 1rem;
        }
        .join-notice {
            margin-top: 0.8rem;
            font-size: 0.8rem;
            opacity: 0.6;
            letter-spacing: 0.5px;
        }

        /* ===== 侧边装饰 ===== */
        .side-decor {
            position: fixed;
            top: 0;
            width: calc((100vw - 960px) / 2 - 3rem);
            max-width: 260px;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            display: none;
        }
        .side-decor-left {
            left: 1.5rem;
        }
        .side-decor-right {
            right: 1.5rem;
        }

        /* 竖线 */
        .side-line {
            position: absolute;
            top: 15%;
            width: 1px;
            height: 70%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                var(--border) 15%,
                rgba(79,110,247,0.2) 50%,
                var(--border) 85%,
                transparent 100%
            );
        }
        .side-decor-left .side-line {
            right: 0;
        }
        .side-decor-right .side-line {
            left: 0;
        }

        /* 通用形状 */
        .side-shape {
            position: absolute;
            border-radius: 50%;
        }

        /* 左侧形状定位 */
        .side-decor-left .side-circle-1 {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, rgba(79,110,247,0.08), rgba(79,156,247,0.05));
            top: 12%; right: 20px;
            animation: sideFloat 7s ease-in-out infinite;
        }
        .side-decor-left .side-diamond-1 {
            width: 28px; height: 28px;
            border-radius: 6px;
            background: rgba(79,110,247,0.06);
            top: 28%; right: 50px;
            transform: rotate(45deg);
            animation: sideFloat 9s ease-in-out infinite 1s;
        }
        .side-decor-left .side-circle-2 {
            width: 36px; height: 36px;
            background: rgba(245,166,35,0.06);
            top: 48%; right: 15px;
            animation: sideFloat 8s ease-in-out infinite 2s;
        }
        .side-decor-left .side-dot-1 {
            width: 8px; height: 8px;
            background: rgba(79,110,247,0.15);
            top: 22%; right: 70px;
            animation: sideFloat 6s ease-in-out infinite 0.5s;
        }
        .side-decor-left .side-dot-2 {
            width: 6px; height: 6px;
            background: rgba(240,100,73,0.12);
            top: 62%; right: 60px;
            animation: sideFloat 7.5s ease-in-out infinite 1.5s;
        }
        .side-decor-left .side-diamond-2 {
            width: 18px; height: 18px;
            border-radius: 4px;
            background: rgba(79,156,247,0.06);
            top: 75%; right: 35px;
            transform: rotate(45deg);
            animation: sideFloat 8.5s ease-in-out infinite 3s;
        }

        /* 右侧形状定位（镜像） */
        .side-decor-right .side-circle-1 {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, rgba(79,156,247,0.08), rgba(79,110,247,0.05));
            top: 18%; left: 20px;
            animation: sideFloat 8s ease-in-out infinite 0.5s;
        }
        .side-decor-right .side-diamond-1 {
            width: 22px; height: 22px;
            border-radius: 5px;
            background: rgba(240,100,73,0.06);
            top: 35%; left: 55px;
            transform: rotate(45deg);
            animation: sideFloat 7s ease-in-out infinite 1.5s;
        }
        .side-decor-right .side-circle-2 {
            width: 40px; height: 40px;
            background: rgba(79,110,247,0.06);
            top: 55%; left: 10px;
            animation: sideFloat 9s ease-in-out infinite 2.5s;
        }
        .side-decor-right .side-dot-1 {
            width: 7px; height: 7px;
            background: rgba(245,166,35,0.14);
            top: 25%; left: 65px;
            animation: sideFloat 6.5s ease-in-out infinite 1s;
        }
        .side-decor-right .side-dot-2 {
            width: 9px; height: 9px;
            background: rgba(79,110,247,0.12);
            top: 70%; left: 45px;
            animation: sideFloat 7s ease-in-out infinite 2s;
        }
        .side-decor-right .side-diamond-2 {
            width: 16px; height: 16px;
            border-radius: 3px;
            background: rgba(79,110,247,0.05);
            top: 82%; left: 30px;
            transform: rotate(45deg);
            animation: sideFloat 8s ease-in-out infinite 3.5s;
        }

        @keyframes sideFloat {
            0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(-10px) rotate(var(--rot, 0deg)); }
        }
        .side-diamond-1, .side-diamond-2 {
            --rot: 45deg;
        }

        /* 侧边标签 */
        .side-tag {
            position: absolute;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-muted);
            opacity: 0.25;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        .side-decor-left .side-tag-1 { top: 20%; right: 8px; }
        .side-decor-left .side-tag-2 { top: 45%; right: 8px; }
        .side-decor-left .side-tag-3 { top: 70%; right: 8px; }
        .side-decor-right .side-tag-1 { top: 22%; left: 8px; }
        .side-decor-right .side-tag-2 { top: 48%; left: 8px; }
        .side-decor-right .side-tag-3 { top: 73%; left: 8px; }

        /* 桌面端显示侧边装饰 */
        @media (min-width: 1200px) {
            .side-decor {
                display: block;
            }
        }

        /* ===== 粒子背景 ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }
        .top-bar, .container, footer {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<!-- 左侧装饰 -->
<div class="side-decor side-decor-left" aria-hidden="true">
    <div class="side-line"></div>
    <div class="side-shape side-circle-1"></div>
    <div class="side-shape side-diamond-1"></div>
    <div class="side-shape side-circle-2"></div>
    <div class="side-shape side-dot-1"></div>
    <div class="side-shape side-dot-2"></div>
    <div class="side-shape side-diamond-2"></div>
    <div class="side-tag side-tag-1">团结</div>
    <div class="side-tag side-tag-2">协作</div>
    <div class="side-tag side-tag-3">创新</div>
</div>

<!-- 右侧装饰 -->
<div class="side-decor side-decor-right" aria-hidden="true">
    <div class="side-line"></div>
    <div class="side-shape side-circle-1"></div>
    <div class="side-shape side-diamond-1"></div>
    <div class="side-shape side-circle-2"></div>
    <div class="side-shape side-dot-1"></div>
    <div class="side-shape side-dot-2"></div>
    <div class="side-shape side-diamond-2"></div>
    <div class="side-tag side-tag-1">成长</div>
    <div class="side-tag side-tag-2">热爱</div>
    <div class="side-tag side-tag-3">共赢</div>
</div>

<div class="top-bar" id="topBar">
    <a href="/" class="logo">
        <div class="logo-icon">联</div>
        联合公社
    </a>
    <a href="/" class="back-btn">
        <span class="back-arrow">←</span> 返回首页
    </a>
</div>

<main class="container">
    <div class="page-header">
        <h1>全部社员</h1>
        <p>每一位为公社贡献力量的伙伴</p>
    </div>

    <!-- 统计 -->
    <div class="stats-bar" id="statsBar">
        <div class="stat-item">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">社员总数</div>
        </div>
    </div>

    <!-- 社员列表 -->
    <div class="member-grid" id="memberGrid"></div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">暂无社员</div>
    </div>

    <!-- 加入我们 -->
    <section class="join-section" id="join-section">
        <div class="join-card">
            <div class="join-icon">✦</div>
            <h2 class="join-title">加入我们</h2>
            <p class="join-desc">无论你擅长什么，联合公社都欢迎你的加入。在这里，与志同道合的伙伴一起成长、创造、发光。</p>
            <form class="join-form" id="joinForm" onsubmit="return false;">
                <div class="form-row">
                    <input type="text" class="form-input" placeholder="你的称呼" disabled>
                    <input type="text" class="form-input" placeholder="意向分社" disabled>
                </div>
                <textarea class="form-textarea" placeholder="简单介绍一下自己吧…" rows="3" disabled></textarea>
                <button type="submit" class="join-btn join-btn-disabled" id="joinBtn">
                    提交申请
                </button>
                <p class="join-notice" id="joinNotice">申请通道暂未开放，敬请期待</p>
            </form>
        </div>
    </section>
</main>

<footer>
    © 2026 联合公社 · 学生团体组织
</footer>

<script src="/js/members-data.js"></script>
<script>
    // ===== 锚点滚动 =====
    if (window.location.hash) {
        window.addEventListener('load', () => {
            const target = document.querySelector(window.location.hash);
            if (target) {
                setTimeout(() => {
                    target.scrollIntoView({ behavior: 'smooth' });
                }, 300);
            }
        });
    }

    // ===== 导航栏滚动效果 =====
    const topBar = document.getElementById('topBar');
    window.addEventListener('scroll', () => {
        topBar.classList.toggle('scrolled', window.scrollY > 10);
    });

    // 渲染社员网格
    function renderMemberGrid() {
        const grid = document.getElementById('memberGrid');
        if (!grid) return;
        grid.innerHTML = '';
        MEMBERS.forEach(member => {
            const card = document.createElement('div');
            card.className = 'member-card';
            card.innerHTML = `
                <img class="member-avatar" src="${member.avatar}" alt="${member.name}头像">
                <div class="member-info">
                    <div class="member-name">${member.name}</div>
                    <div class="member-bio">${member.bio}</div>
                </div>
            `;
            grid.appendChild(card);
        });
        // 更新统计数字
        const totalEl = document.getElementById('totalCount');
        if (totalEl) {
            animateNumber(totalEl, MEMBERS.length);
        }
        // 添加入场动画类
        document.querySelectorAll('.member-card').forEach((card, i) => {
            setTimeout(() => card.classList.add('visible'), i * 100);
        });
    }

    function animateNumber(el, target) {
        let current = 0;
        const step = Math.max(1, Math.floor(target / 20));
        const interval = setInterval(() => {
            current += step;
            if (current >= target) {
                current = target;
                clearInterval(interval);
            }
            el.textContent = current;
        }, 40);
    }

    document.addEventListener('DOMContentLoaded', renderMemberGrid);

    // ===== 粒子背景效果 =====
    (function() {
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let vw, vh, pageHeight, particles, animId;
        const mouse = { x: -9999, y: -9999 };

        const colors = [
            'rgba(79,110,247,',
            'rgba(79,156,247,',
            'rgba(59,93,231,',
            'rgba(240,100,73,',
            'rgba(245,166,35,',
        ];

        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        document.addEventListener('mouseleave', () => {
            mouse.x = -9999;
            mouse.y = -9999;
        });

        function resize() {
            vw = canvas.width = window.innerWidth;
            vh = canvas.height = window.innerHeight;
            pageHeight = document.documentElement.scrollHeight;
        }

        function createParticle(fadeIn) {
            const colorBase = colors[Math.random() < 0.75 ? Math.floor(Math.random() * 3) : 3 + Math.floor(Math.random() * 2)];
            const scrollY = window.scrollY;
            const yMin = fadeIn ? scrollY : 0;
            const yMax = fadeIn ? scrollY + vh : pageHeight;
            return {
                x: Math.random() * vw,
                y: yMin + Math.random() * (yMax - yMin),
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.3 - 0.15,
                radius: Math.random() * 2.5 + 1,
                color: colorBase,
                alpha: fadeIn ? 0 : (Math.random() * 0.4 + 0.15),
                targetAlpha: Math.random() * 0.4 + 0.15,
                alphaDir: (Math.random() - 0.5) * 0.005,
                fadingOut: false,
                fadingIn: !!fadeIn,
            };
        }

        function createParticles() {
            const count = Math.min(Math.floor((vw * vh) / 18000), 80);
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(createParticle(false));
            }
        }

        function update() {
            const scrollY = window.scrollY;
            particles.forEach((p, i) => {
                const screenY = p.y - scrollY;
                const dx = p.x - mouse.x;
                const dy = screenY - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150 && dist > 0) {
                    const force = (150 - dist) / 150 * 0.3;
                    p.vx += (dx / dist) * force;
                    p.vy += (dy / dist) * force;
                }

                p.vx *= 0.99;
                p.vy *= 0.99;
                p.x += p.vx;
                p.y += p.vy;

                if (p.fadingIn) {
                    p.alpha += 0.012;
                    if (p.alpha >= p.targetAlpha) {
                        p.alpha = p.targetAlpha;
                        p.fadingIn = false;
                    }
                }

                if (!p.fadingIn && !p.fadingOut) {
                    p.alpha += p.alphaDir;
                    if (p.alpha > 0.55 || p.alpha < 0.1) p.alphaDir *= -1;
                }

                const margin = 50;
                const viewY = p.y - scrollY;
                const outOfView = p.x < -margin || p.x > vw + margin || viewY < -margin || viewY > vh + margin;
                if (outOfView) {
                    p.fadingOut = true;
                } else if (p.fadingOut && !p.fadingIn) {
                    p.fadingOut = false;
                    if (p.alpha < 0.1) p.alpha = 0.1;
                }

                if (p.fadingOut) {
                    p.alpha -= 0.008;
                    if (p.alpha <= 0) {
                        particles[i] = createParticle(true);
                    }
                }
            });
        }

        function drawParticle(p) {
            const screenY = p.y - window.scrollY;
            if (screenY < -20 || screenY > vh + 20) return;
            ctx.beginPath();
            ctx.arc(p.x, screenY, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color + p.alpha + ')';
            ctx.fill();
        }

        function drawLines() {
            const scrollY = window.scrollY;
            const maxDist = 120;
            for (let i = 0; i < particles.length; i++) {
                const pi = particles[i];
                const si = pi.y - scrollY;
                if (si < -maxDist || si > vh + maxDist) continue;
                for (let j = i + 1; j < particles.length; j++) {
                    const pj = particles[j];
                    const sj = pj.y - scrollY;
                    if (sj < -maxDist || sj > vh + maxDist) continue;
                    const dx = pi.x - pj.x;
                    const dy = si - sj;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.12;
                        ctx.beginPath();
                        ctx.moveTo(pi.x, si);
                        ctx.lineTo(pj.x, sj);
                        ctx.strokeStyle = 'rgba(79,110,247,' + alpha + ')';
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, vw, vh);
            update();
            drawLines();
            particles.forEach(drawParticle);
            animId = requestAnimationFrame(animate);
        }

        function init() {
            resize();
            createParticles();
            if (animId) cancelAnimationFrame(animId);
            animate();
        }

        const resizeObserver = new ResizeObserver(() => {
            pageHeight = document.documentElement.scrollHeight;
        });
        resizeObserver.observe(document.documentElement);

        window.addEventListener('resize', () => {
            resize();
            createParticles();
        });

        init();
    })();
</script>
</body>
</html>

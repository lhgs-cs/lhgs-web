<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>全部社员 | 联合公社</title>

    <meta name="description" content="联合公社全部社员名单，以及每位社员所属的分社。">
    <link rel="canonical" href="https://lianhegongshe.cn/members/">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta name="theme-color" content="#1d5578">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="联合公社">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="全部社员 | 联合公社">
    <meta property="og:description" content="联合公社全部社员名单，以及每位社员所属的分社。">
    <meta property="og:url" content="https://lianhegongshe.cn/members/">
    <meta property="og:image" content="https://lianhegongshe.cn/images/logo.jpeg">
    <meta property="og:image:width" content="400">
    <meta property="og:image:height" content="395">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="全部社员 | 联合公社">
    <meta name="twitter:description" content="联合公社全部社员名单，以及每位社员所属的分社。">
    <meta name="twitter:image" content="https://lianhegongshe.cn/images/logo.jpeg">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/effects.css">
    <style>
        /* ===== 页面标题 ===== */
        .page-header {
            text-align: center;
            margin: 2rem 0 3rem;
            position: relative;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-blue) 50%, var(--primary-dark) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            animation: heroGradient 4s ease infinite;
        }
        .page-header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        /* 装饰浮动圆 */
        .page-header::before,
        .page-header::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.06;
            pointer-events: none;
        }
        .page-header::before {
            width: 160px;
            height: 160px;
            background: var(--primary);
            top: -30px;
            left: -40px;
            animation: float 6s ease-in-out infinite;
        }
        .page-header::after {
            width: 100px;
            height: 100px;
            background: var(--accent-orange);
            bottom: -10px;
            right: -30px;
            animation: float 8s ease-in-out infinite reverse;
        }

        /* ===== 统计条 ===== */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
            padding: 1rem 1.5rem;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            min-width: 120px;
            transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
        }
        .stat-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        /* ===== 社员网格 ===== */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .member-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease),
                        border-color 0.35s var(--ease);
            cursor: default;
            opacity: 0;
            transform: translateY(20px);
        }
        .member-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .member-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .member-avatar {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            object-fit: cover;
            background-color: var(--surface-hover);
            flex-shrink: 0;
            transition: transform 0.3s var(--ease), border-radius 0.3s var(--ease);
        }
        .member-card:hover .member-avatar {
            transform: scale(1.08);
            border-radius: 50%;
        }

        .member-info {
            flex: 1;
            min-width: 0;
        }
        .member-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .member-bio {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            display: none;
        }
        .empty-state.show {
            display: block;
        }
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .empty-text {
            font-size: 1rem;
        }

        /* ===== 加入我们按钮 ===== */
        .join-page-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-blue) 100%);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.85rem 2.5rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            transition: transform 0.32s var(--ease), box-shadow 0.32s var(--ease);
            box-shadow: var(--shadow-sm);
        }
        .join-page-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(29,85,120,0.4);
        }

        /* ===== 侧边装饰 ===== */
        .side-decor {
            position: fixed;
            top: 0;
            width: calc((100vw - 960px) / 2 - 3rem);
            max-width: 260px;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            display: none;
        }
        .side-decor-left {
            left: 1.5rem;
        }
        .side-decor-right {
            right: 1.5rem;
        }

        /* 竖线 */
        .side-line {
            position: absolute;
            top: 15%;
            width: 1px;
            height: 70%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                var(--border) 15%,
                rgba(29,85,120,0.2) 50%,
                var(--border) 85%,
                transparent 100%
            );
        }
        .side-decor-left .side-line {
            right: 0;
        }
        .side-decor-right .side-line {
            left: 0;
        }

        /* 通用形状 */
        .side-shape {
            position: absolute;
            border-radius: 50%;
        }

        /* 左侧形状定位 */
        .side-decor-left .side-circle-1 {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, rgba(29,85,120,0.08), rgba(44,107,143,0.05));
            top: 12%; right: 20px;
            animation: sideFloat 7s ease-in-out infinite;
        }
        .side-decor-left .side-diamond-1 {
            width: 28px; height: 28px;
            border-radius: 6px;
            background: rgba(29,85,120,0.06);
            top: 28%; right: 50px;
            transform: rotate(45deg);
            animation: sideFloat 9s ease-in-out infinite 1s;
        }
        .side-decor-left .side-circle-2 {
            width: 36px; height: 36px;
            background: rgba(176,141,79,0.06);
            top: 48%; right: 15px;
            animation: sideFloat 8s ease-in-out infinite 2s;
        }
        .side-decor-left .side-dot-1 {
            width: 8px; height: 8px;
            background: rgba(29,85,120,0.15);
            top: 22%; right: 70px;
            animation: sideFloat 6s ease-in-out infinite 0.5s;
        }
        .side-decor-left .side-dot-2 {
            width: 6px; height: 6px;
            background: rgba(168,58,46,0.12);
            top: 62%; right: 60px;
            animation: sideFloat 7.5s ease-in-out infinite 1.5s;
        }
        .side-decor-left .side-diamond-2 {
            width: 18px; height: 18px;
            border-radius: 4px;
            background: rgba(44,107,143,0.06);
            top: 75%; right: 35px;
            transform: rotate(45deg);
            animation: sideFloat 8.5s ease-in-out infinite 3s;
        }

        /* 右侧形状定位（镜像） */
        .side-decor-right .side-circle-1 {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, rgba(44,107,143,0.08), rgba(29,85,120,0.05));
            top: 18%; left: 20px;
            animation: sideFloat 8s ease-in-out infinite 0.5s;
        }
        .side-decor-right .side-diamond-1 {
            width: 22px; height: 22px;
            border-radius: 5px;
            background: rgba(168,58,46,0.06);
            top: 35%; left: 55px;
            transform: rotate(45deg);
            animation: sideFloat 7s ease-in-out infinite 1.5s;
        }
        .side-decor-right .side-circle-2 {
            width: 40px; height: 40px;
            background: rgba(29,85,120,0.06);
            top: 55%; left: 10px;
            animation: sideFloat 9s ease-in-out infinite 2.5s;
        }
        .side-decor-right .side-dot-1 {
            width: 7px; height: 7px;
            background: rgba(176,141,79,0.14);
            top: 25%; left: 65px;
            animation: sideFloat 6.5s ease-in-out infinite 1s;
        }
        .side-decor-right .side-dot-2 {
            width: 9px; height: 9px;
            background: rgba(29,85,120,0.12);
            top: 70%; left: 45px;
            animation: sideFloat 7s ease-in-out infinite 2s;
        }
        .side-decor-right .side-diamond-2 {
            width: 16px; height: 16px;
            border-radius: 3px;
            background: rgba(29,85,120,0.05);
            top: 82%; left: 30px;
            transform: rotate(45deg);
            animation: sideFloat 8s ease-in-out infinite 3.5s;
        }

        @keyframes sideFloat {
            0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(-10px) rotate(var(--rot, 0deg)); }
        }
        .side-diamond-1, .side-diamond-2 {
            --rot: 45deg;
        }

        /* 侧边标签 */
        .side-tag {
            position: absolute;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-muted);
            opacity: 0.25;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        .side-decor-left .side-tag-1 { top: 20%; right: 8px; }
        .side-decor-left .side-tag-2 { top: 45%; right: 8px; }
        .side-decor-left .side-tag-3 { top: 70%; right: 8px; }
        .side-decor-right .side-tag-1 { top: 22%; left: 8px; }
        .side-decor-right .side-tag-2 { top: 48%; left: 8px; }
        .side-decor-right .side-tag-3 { top: 73%; left: 8px; }

        /* 桌面端显示侧边装饰 */
        @media (min-width: 1200px) {
            .side-decor {
                display: block;
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .container {
                padding: 1rem 1rem 2rem;
            }
            .page-header {
                margin: 1.5rem 0 2rem;
            }
            .page-header h1 {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }
            .page-header p {
                font-size: 0.88rem;
            }
            .member-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .member-card {
                padding: 1.1rem;
                border-radius: var(--radius-lg);
            }
            .member-avatar {
                width: 48px;
                height: 48px;
                border-radius: var(--radius-md);
            }
            .member-name {
                font-size: 1rem;
            }
            .stats-bar {
                gap: 0.8rem;
                margin-bottom: 2rem;
            }
            .stat-item {
                min-width: 90px;
                padding: 0.7rem 0.8rem;
                border-radius: var(--radius-lg);
            }
            .stat-number {
                font-size: 1.5rem;
            }
            .stat-label {
                font-size: 0.75rem;
            }
            .page-header::before {
                width: 100px;
                height: 100px;
            }
            .page-header::after {
                width: 60px;
                height: 60px;
            }
            footer {
                padding: 2rem 1rem;
            }
        }

        @media (max-width: 480px) {
            .top-bar {
                padding: 0.6rem 0.8rem;
            }
            .logo {
                font-size: 1.2rem;
            }
            .logo-icon {
                width: 24px;
                height: 24px;
                font-size: 0.7rem;
                border-radius: 6px;
            }
            .back-btn {
                font-size: 0.82rem;
                padding: 0.4rem 0.6rem;
            }
            .container {
                padding: 0.8rem 0.75rem 2rem;
            }
            .page-header {
                margin: 1rem 0 1.5rem;
            }
            .page-header h1 {
                font-size: 1.5rem;
                letter-spacing: 0.5px;
            }
            .page-header p {
                font-size: 0.82rem;
            }
            .stats-bar {
                gap: 0.6rem;
            }
            .stat-item {
                flex: 1;
                min-width: 0;
                padding: 0.6rem 0.5rem;
            }
            .stat-number {
                font-size: 1.3rem;
            }
            .member-card {
                padding: 0.9rem;
                gap: 0.75rem;
            }
            .member-avatar {
                width: 42px;
                height: 42px;
                border-radius: var(--radius-md);
            }
            .member-name {
                font-size: 0.95rem;
            }
            .member-bio {
                font-size: 0.78rem;
            }
            .empty-state {
                padding: 3rem 1rem;
            }
        }

    </style>
</head>
<body>

<canvas id="particles-canvas" aria-hidden="true"></canvas>

<!-- 左侧装饰 -->
<div class="side-decor side-decor-left" aria-hidden="true">
    <div class="side-line"></div>
    <div class="side-shape side-circle-1"></div>
    <div class="side-shape side-diamond-1"></div>
    <div class="side-shape side-circle-2"></div>
    <div class="side-shape side-dot-1"></div>
    <div class="side-shape side-dot-2"></div>
    <div class="side-shape side-diamond-2"></div>
    <div class="side-tag side-tag-1">团结</div>
    <div class="side-tag side-tag-2">协作</div>
    <div class="side-tag side-tag-3">创新</div>
</div>

<!-- 右侧装饰 -->
<div class="side-decor side-decor-right" aria-hidden="true">
    <div class="side-line"></div>
    <div class="side-shape side-circle-1"></div>
    <div class="side-shape side-diamond-1"></div>
    <div class="side-shape side-circle-2"></div>
    <div class="side-shape side-dot-1"></div>
    <div class="side-shape side-dot-2"></div>
    <div class="side-shape side-diamond-2"></div>
    <div class="side-tag side-tag-1">成长</div>
    <div class="side-tag side-tag-2">热爱</div>
    <div class="side-tag side-tag-3">共赢</div>
</div>

<div class="top-bar" id="topBar">
    <a href="/" class="logo">
        <div class="logo-icon">联</div>
        联合公社
    </a>
    <a href="/" class="back-btn">
        <span class="back-arrow">←</span> 返回首页
    </a>
</div>

<main class="container">
    <div class="page-header">
        <h1>全部社员</h1>
        <p>每一位为公社贡献力量的伙伴</p>
    </div>

    <!-- 统计 -->
    <div class="stats-bar" id="statsBar">
        <div class="stat-item">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">社员总数</div>
        </div>
    </div>

    <!-- 社员列表 -->
    <div class="member-grid" id="memberGrid"></div>

    <noscript>
        <p class="nojs-tip">社员列表需要启用 JavaScript 才能显示。</p>
    </noscript>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">暂无社员</div>
    </div>

    <!-- 加入我们 -->
    <div style="text-align:center; margin-top:3rem;">
        <a href="/join.html" class="join-page-btn">加入我们</a>
    </div>
</main>

<footer>
    © <span id="copyright-year">2026</span> 联合公社 · 学生团体组织
</footer>

<script src="/js/members-data.js"></script>
<script>
    // ===== 锚点滚动 =====
    if (window.location.hash) {
        window.addEventListener('load', () => {
            const target = document.querySelector(window.location.hash);
            if (target) {
                setTimeout(() => {
                    target.scrollIntoView({ behavior: 'smooth' });
                }, 300);
            }
        });
    }


    // 渲染社员网格
    function renderMemberGrid() {
        const grid = document.getElementById('memberGrid');
        if (!grid) return;

        if (typeof MEMBERS === 'undefined' || !MEMBERS.length) {
            const empty = document.getElementById('emptyState');
            if (empty) empty.classList.add('show');
            return;
        }

        grid.textContent = '';
        MEMBERS.forEach((member) => {
            const card = document.createElement('div');
            card.className = 'member-card';

            const img = document.createElement('img');
            img.className = 'member-avatar';
            img.src = member.avatar;
            img.alt = member.name + '头像';
            img.width = 200;
            img.height = 200;
            img.loading = 'lazy';
            img.decoding = 'async';

            const info = document.createElement('div');
            info.className = 'member-info';

            const name = document.createElement('div');
            name.className = 'member-name';
            name.textContent = member.name;

            const bio = document.createElement('div');
            bio.className = 'member-bio';
            bio.textContent = member.bio || '暂无简介';

            info.append(name, bio);
            card.append(img, info);
            grid.appendChild(card);
        });

        // 更新统计数字
        const totalEl = document.getElementById('totalCount');
        if (totalEl) animateNumber(totalEl, MEMBERS.length);

        // 入场动画
        grid.querySelectorAll('.member-card').forEach((card, i) => {
            setTimeout(() => card.classList.add('visible'), i * 100);
        });
    }

    function animateNumber(el, target) {
        let current = 0;
        const step = Math.max(1, Math.floor(target / 20));
        const interval = setInterval(() => {
            current += step;
            if (current >= target) {
                current = target;
                clearInterval(interval);
            }
            el.textContent = current;
        }, 40);
    }

    document.addEventListener('DOMContentLoaded', renderMemberGrid);

</script>
<script src="/js/particles.js"></script>
<script src="/js/site.js"></script>
</body>
</html>
